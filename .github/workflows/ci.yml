name: CI

on:
  push:
    branches: [main, fxauto-v2]
  pull_request:
    branches: [main, fxauto-v2]

# Least privilege by default: the workflow only reads the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      # No packages.lock.json in the repo, so the NuGet cache is keyed on the project files.
      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/*.props', '**/*.targets') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore FxAuto.sln

      # Directory.Build.props already sets TreatWarningsAsErrors; -warnaserror also covers MSBuild/NuGet warnings.
      - name: Build (Release, warnings are errors)
        run: dotnet build FxAuto.sln -c Release --no-restore -warnaserror

      # The tests are a console runner (not dotnet test): it exits non-zero when any test fails.
      - name: Test
        run: dotnet run --project tests/FxAuto.Tests -c Release --no-build
